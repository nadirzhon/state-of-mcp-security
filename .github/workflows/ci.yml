name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile scripts
        run: python -m compileall -q scripts
      - name: Validate corpus/data JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for p in list(pathlib.Path("data").glob("*.json")) + [pathlib.Path("scripts/corpus.json")]:
              if p.exists():
                  json.loads(p.read_text()); print("ok", p)
          PY
      - name: Regenerate charts (no external deps)
        run: python scripts/charts.py
